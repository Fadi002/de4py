name: comment-lint

on:
  push:
    branches: [dev, master, main]
  pull_request:

permissions:
  contents: read

jobs:
  comment-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run comment slop linter
        run: python scripts/comment_lint.py
      - name: Run linter self-test
        run: python scripts/comment_lint.py --self-test

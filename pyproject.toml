[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "de4py"
version = "3.3.2"
dependencies = [
    "PySide6",
    "requests",
    "psutil",
    "colorama",
    "pypresence",
    "pycryptodome",
    "xdis",
    "pyinstaller",
    "sentry-sdk",
    "pefile",
    "six"
]
description = "Python Deobfuscator & Analyzer"
authors = [
  {name = "Fadi002"},
]
readme = "README.md"
requires-python = ">=3.8"
license = "CC-BY-NC-4.0"

[project.scripts]
de4py = "de4py.main:main"

[tool.setuptools.packages.find]
include = ["de4py*"]
